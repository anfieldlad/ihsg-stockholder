<div x-show="showFeedbackModal" class="fixed inset-0 z-[200] overflow-y-auto" role="dialog" aria-modal="true"
  @keydown.escape.window="closeFeedbackModal()" style="display: none;">

  <!-- Backdrop -->
  <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md transition-opacity" @click="closeFeedbackModal()"></div>

  <!-- Container -->
  <div class="flex min-h-full items-center justify-center p-4 sm:p-6 text-center">
    <div class="glass-panel w-full max-w-xl transform overflow-hidden rounded-2xl bg-slate-900/95 border border-white/10 p-6 sm:p-8 text-left align-middle shadow-2xl transition-all relative z-10"
      @click.stop>

      <!-- Close Button -->
      <button @click="closeFeedbackModal()"
        class="absolute right-5 top-5 text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/5 transition-colors"
        aria-label="Tutup modal">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- SUCCESS CONFIRMATION VIEW -->
      <template x-if="feedbackSuccess">
        <div class="text-center py-6 sm:py-8 space-y-4">
          <div class="w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 mx-auto flex items-center justify-center shadow-lg shadow-emerald-500/20">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <h3 class="text-xl sm:text-2xl font-extrabold text-white">Laporan Berhasil Terkirim!</h3>
          <div x-show="feedbackTicketId" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-800 text-xs font-mono text-blue-400 border border-slate-700">
            <span>Nomor Tiket:</span>
            <span class="font-bold text-white" x-text="feedbackTicketId"></span>
          </div>
          <p class="text-xs sm:text-sm text-slate-300 leading-relaxed max-w-md mx-auto">
            Terima kasih banyak atas ketelitian Anda. Laporan mengenai emiten/investor ini telah masuk ke dalam antrean audit data kami. Tim pengembang akan meninjau rujukan resmi KSEI dalam <strong>1x24–48 jam kerja</strong>. Bersama Anda, data pasar modal kita menjadi lebih transparan dan akurat!
          </p>
          <div class="pt-2">
            <button @click="closeFeedbackModal()"
              class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm font-semibold transition-all shadow-md">
              Selesai & Tutup
            </button>
          </div>
        </div>
      </template>

      <!-- FORM VIEW -->
      <template x-if="!feedbackSuccess">
        <div>
          <!-- Header -->
          <div class="mb-5">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[11px] font-semibold uppercase tracking-wider mb-2">
              <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
              <span>Audit Data & Masukan Pengguna</span>
            </div>
            <h3 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">
              Laporkan Kesalahan Data / Feedback
            </h3>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">
              Bantu kami memverifikasi deviasi tabel KSEI, token menempel, atau beri masukan fitur.
            </p>
          </div>

          <!-- Error Alert Banner -->
          <div x-show="feedbackError" class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <span x-text="feedbackError"></span>
          </div>

          <!-- Category Selector Tabs -->
          <div class="mb-5">
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Kategori Laporan</label>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" @click="feedbackForm.category = 'data_error'"
                :class="feedbackForm.category === 'data_error' ? 'bg-blue-600 text-white border-blue-500' : 'bg-slate-800/60 text-slate-400 hover:text-white border-white/[0.05]'"
                class="px-3 py-2 rounded-xl text-xs font-semibold border text-center transition-all">
                Kesalahan Data
              </button>
              <button type="button" @click="feedbackForm.category = 'feature_request'"
                :class="feedbackForm.category === 'feature_request' ? 'bg-purple-600 text-white border-purple-500' : 'bg-slate-800/60 text-slate-400 hover:text-white border-white/[0.05]'"
                class="px-3 py-2 rounded-xl text-xs font-semibold border text-center transition-all">
                Saran Fitur
              </button>
              <button type="button" @click="feedbackForm.category = 'general_question'"
                :class="feedbackForm.category === 'general_question' ? 'bg-slate-700 text-white border-slate-600' : 'bg-slate-800/60 text-slate-400 hover:text-white border-white/[0.05]'"
                class="px-3 py-2 rounded-xl text-xs font-semibold border text-center transition-all">
                Pertanyaan
              </button>
            </div>
          </div>

          <!-- Context Alert (if autofilled from Stock/Investor modal) -->
          <template x-if="feedbackForm.entity_code || feedbackForm.entity_name">
            <div class="mb-4 p-3 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-between text-xs text-blue-300">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                <span>Konteks:</span>
                <span class="font-bold text-white" x-text="feedbackForm.entity_code"></span>
                <span x-text="feedbackForm.entity_name ? `(${feedbackForm.entity_name})` : ''"></span>
              </div>
              <button type="button" @click="feedbackForm.entity_code = ''; feedbackForm.entity_name = '';" class="text-slate-400 hover:text-white text-xs underline">
                Hapus Konteks
              </button>
            </div>
          </template>

          <!-- Input Fields Grid -->
          <div class="space-y-4">

            <!-- Entity Inputs (if not pre-filled) -->
            <div x-show="!feedbackForm.entity_code && !feedbackForm.entity_name" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Kode Saham (Opsional)</label>
                <input type="text" x-model="feedbackForm.entity_code" placeholder="Misal: BBCA" maxlength="10"
                  class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 uppercase focus:outline-none focus:ring-1 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Nama Emiten / Investor (Opsional)</label>
                <input type="text" x-model="feedbackForm.entity_name" placeholder="Misal: BANK CENTRAL ASIA"
                  class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
              </div>
            </div>

            <!-- Error Type Dropdown (for data_error) -->
            <div x-show="feedbackForm.category === 'data_error'">
              <label class="block text-xs font-medium text-slate-400 mb-1">Tipe Kendala Data</label>
              <select x-model="feedbackForm.error_type"
                class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="glued_token">Teks menempel / kepotong (glued token, misal: TbkDRS...)</option>
                <option value="wrong_shares">Jumlah lembar saham salah / beda dengan laporan resmi</option>
                <option value="wrong_percentage">Persentase kepemilikan keliru</option>
                <option value="wrong_classification">Klasifikasi investor (Lokal/Asing atau CP/ID) terbalik</option>
                <option value="missing_shareholder">Pemegang saham >1% tidak tercantum</option>
                <option value="price_discrepancy">Harga live Yahoo Finance macet / deviasi ekstrem</option>
                <option value="other_feedback">Kendala lainnya</option>
              </select>
            </div>

            <!-- Description Textarea -->
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">
                Deskripsi Kendala / Masukan <span class="text-rose-400">*</span>
              </label>
              <textarea x-model="feedbackForm.description" rows="3"
                placeholder="Jelaskan detail ketidaksesuaian data atau saran yang Anda miliki..."
                class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500 resize-none"></textarea>
            </div>

            <!-- Reference URL (Optional) -->
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Tautan Bukti / Rujukan Resmi (Opsional)</label>
              <input type="url" x-model="feedbackForm.reference_url" placeholder="https://www.idx.co.id/... atau link pengumuman KSEI"
                class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>

            <!-- Reporter Contact (Optional) -->
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Email / Telegram Anda (Opsional)</label>
              <input type="text" x-model="feedbackForm.reporter_contact" placeholder="investor@example.com atau @username"
                class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
              <span class="block text-[11px] text-slate-500 mt-1">Hanya digunakan apabila tim kami membutuhkan klarifikasi lebih lanjut.</span>
            </div>

          </div>

          <!-- Footer Actions -->
          <div class="mt-6 pt-4 border-t border-white/[0.06] flex items-center justify-between gap-3">
            <span class="text-[11px] text-slate-400 hidden sm:inline">SLA respon: 24–48 jam kerja</span>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
              <button type="button" @click="closeFeedbackModal()"
                class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition-colors">
                Batal
              </button>
              <button type="button" @click="submitFeedback()" :disabled="feedbackSubmitting"
                class="px-5 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-50 text-xs font-semibold text-white shadow-md shadow-blue-500/20 transition-all flex items-center gap-2">
                <template x-if="feedbackSubmitting">
                  <svg class="animate-spin -ml-0.5 mr-1 h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                </template>
                <span x-text="feedbackSubmitting ? 'Mengirim...' : 'Kirim Laporan'"></span>
              </button>
            </div>
          </div>

        </div>
      </template>

    </div>
  </div>
</div>
