name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-module-smoke:
    name: js-module-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify named exports (M0-7 static check)
        run: node scripts/verify_imports.js

      - name: Verify ES module imports
        run: node tests/test_module_imports.js

      - name: Verify investor name normalization
        run: node tests/test_normalize.js

      - name: Verify text formatting utility
        run: node tests/test_title_case.js

      - name: Verify max holders sort
        run: node tests/test_max_holders.js

      - name: Verify fallback markup & watcher
        run: node tests/test_fallback_markup.js

      - name: Verify file structures
        run: node tests/verify_files.js

  store-boot:
    name: store-boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run store boot simulation
        run: node tests/test_store_boot.js

  headers-parity:
    name: headers-parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify security headers parity (vercel.json vs deploy/headers.json vs nginx)
        run: python3 scripts/generate_headers.py --check

  leak-guard:
    name: leak-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run security leak guard
        run: |
          if [ -f scripts/leak_guard.py ]; then
            python3 scripts/leak_guard.py
          else
            echo "scripts/leak_guard.py not found on this branch; skipping until rebase onto hotfix/m0-public-root"
          fi

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt pytest
          fi

      - name: Run Pytest test suite
        run: pytest -v

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt playwright==1.51.0
          fi

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run Playwright Chromium E2E
        run: python3 tests/test_browser_e2e.py
